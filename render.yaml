services:
  - type: web
    name: dakzo-systems
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: SITE_URL
        value: https://dakzosystems.com
      - key: AIRTABLE_LEAD_WEBHOOK_URL
        sync: false
      - key: GTM_ID
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
